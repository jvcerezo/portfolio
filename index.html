      Loaded here rather than via @import in index.css: an @import inside the

      serialises the font request behind it and defeats the preconnect above.

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

    <!-- Theme init (before paint, avoids FOUC) -->

        } catch (e) {}
